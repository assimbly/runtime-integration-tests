---
dil:
  integrations:
    integration:
      flows:
        flow:
          name: "settenantvariable_test1"
          id: "settenantvariable_test1"
          type: "esb"
          steps:
            step:
            - id: 1
              type: "source"
              uri: "http://0.0.0.0:9001/1/SetTenantVariable"
            - options:
                environment: "test"
                expression: "simple"
                encrypt: false
                modifier: "ComponentsTests/GetVariable"
                operation: "SET"
                value: "RAW(dGVzdA==)"
                tenant: "default"
              id: 2
              type: "action"
              uri: "tenantvariables://MyVariable"
            - options:
                environment: "test"
                header: "MyVariable"
                operation: "GET"
                tenant: "default"
              id: 3
              type: "action"
              uri: "tenantvariables://MyVariable"
            - id: 4
              type: "sink"
              uri: "velocity:${header.MyVariable}"
